name: Bug or compatibility report
description: Something doesn't work, or a report from a Mac we haven't tested yet
body:
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: MacBook Pro 14" 2021, M1 Pro
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu > About This Mac
      placeholder: "14.7.2"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Trackpad Anything version and how you got it
      placeholder: 1.1.0, release zip (or built from source at commit …)
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Connection
      options: [Bluetooth, USB cable, Both]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Which gestures or features work and which don't.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Copy the text from the app's "Device & diagnostics" page. It contains no addresses or keys.
      render: text
